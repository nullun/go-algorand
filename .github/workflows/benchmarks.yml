name: "Benchmark workflow"
on:
  # Push and update benchmarks when a commit is merged into master.
  push:
    branches:
      - master
  # Trigger benchmark test on this PR's commit against master.
  pull_request:
    branches:
      - master
permissions:
  # Push benchmark performance graph to gh-pages branch.
  contents: write
  deployments: write
jobs:
  benchmark:
    name: Performance regression check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: ./.github/actions/setup-go
      - run: go version
      - name: Build go-algorand
        run: |
          export SKIP_GO_INSTALLATION=True
          scripts/travis/build.sh
      # BenchmarkUintMath - Serves as a proxy for AVM `eval` performance.
      # Performance degradations suggest either or both:  (1) op code
      # degradation, (2) `eval` degradation.  (2) suggests a broader performance
      # issue. 
      - name: Run benchmark
        # Trim each result line down to the ns/op measurement. The additional
        # metrics (extra/op, B/op, allocs/op) cause github-action-benchmark to
        # store five series per benchmark in gh-pages data.js, two of which
        # duplicate the ns/op value.
        run: |
          go test ./data/transactions/logic -bench 'BenchmarkUintMath' -run=^$ | tee benchmark_output_raw.txt
          sed -E 's|(ns/op).*|\1|' benchmark_output_raw.txt > benchmark_output.txt
      - name: Push benchmark result to gh-pages branch
        if: github.event_name == 'push'
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: Go Benchmark
          tool: 'go'
          output-file-path: benchmark_output.txt
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
      - name: Evaluate benchmark on PR branch
        if: github.event.pull_request
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: Go Benchmark
          tool: 'go'
          output-file-path: benchmark_output.txt
          github-token: ${{ secrets.GITHUB_TOKEN }}
          # Consecutive-run variance on ubuntu-latest runners has stayed under
          # 1.5x since 2024, so 150% alerts on real regressions that the old
          # 200% threshold would miss without producing noise.
          alert-threshold: '150%'
          comment-on-alert: true
      - name: Slack Notification
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          curl -X POST --data-urlencode "payload={\"text\": \"Benchmark workflow failed. ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} \"}" $SLACK_WEBHOOK_URL
        if: ${{ failure() && (contains(github.ref_name, 'rel/nightly') || contains(github.ref_name, 'rel/beta') || contains(github.ref_name, 'rel/stable') || contains(github.ref_name, 'master')) }}
